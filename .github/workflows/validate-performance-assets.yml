name: Validate And Run Performance Assets

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Apache JMeter
        shell: bash
        run: |
          JMETER_VERSION=5.6.3
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" -o apache-jmeter.tgz
          tar -xzf apache-jmeter.tgz
          echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Validate JMeter plan and report structure
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          plan_path = root / 'Performance_Testing.jmx'
          if not plan_path.exists():
              raise SystemExit('Missing Performance_Testing.jmx')

          ET.parse(plan_path)

          scenarios = ['baseline', 'load', 'peak', 'stress']
          required_files = ['index.html', 'statistics.json']
          for scenario in scenarios:
              report_dir = root / 'reports' / scenario
              if not report_dir.exists():
                  raise SystemExit(f'Missing report directory: {report_dir}')

              for required_file in required_files:
                  file_path = report_dir / required_file
                  if not file_path.exists():
                      raise SystemExit(f'Missing required report file: {file_path}')

              with (report_dir / 'statistics.json').open(encoding='utf-8') as handle:
                  json.load(handle)

              result_file = root / 'results' / f'{scenario}.jtl'
              if not result_file.exists():
                  raise SystemExit(f'Missing result file: {result_file}')

          reports_index = root / 'reports' / 'index.html'
          if not reports_index.exists():
              raise SystemExit('Missing reports/index.html landing page')

          print('Performance testing assets validated successfully.')
          PY

      - name: Upload report dashboards as artifact
        uses: actions/upload-artifact@v4
        with:
          name: committed-performance-reports
          path: reports/

      - name: Run all scenario smoke tests sequentially
        shell: bash
        run: |
          mkdir -p artifacts
          for SCENARIO in baseline load peak stress endurance; do
            echo "::group::Smoke test: $SCENARIO"
            python .github/scripts/prepare_smoke_plan.py "$SCENARIO"
            rm -rf "artifacts/${SCENARIO}-report"
            jmeter -n \
              -t "artifacts/${SCENARIO}-smoke-test.jmx" \
              -l "artifacts/${SCENARIO}-results.jtl" \
              -e -o "artifacts/${SCENARIO}-report"
            echo "::endgroup::"
          done

      - name: Upload CI smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-test-artifacts
          path: artifacts/

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ *Performance Tests Passed*",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                    { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Commit", "value": "${{ github.sha }}", "short": false },
                    { "title": "Scenarios", "value": "baseline, load, peak, stress, endurance", "short": false },
                    { "title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "❌ *Performance Tests Failed*",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                    { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Commit", "value": "${{ github.sha }}", "short": false },
                    { "title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
