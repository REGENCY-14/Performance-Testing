name: Validate And Run Performance Assets

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario template to use for the CI smoke run
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - load
          - peak
          - stress
          - endurance

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Apache JMeter
        shell: bash
        run: |
          JMETER_VERSION=5.6.3
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" -o apache-jmeter.tgz
          tar -xzf apache-jmeter.tgz
          echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Validate JMeter plan and report structure
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          plan_path = root / 'Performance_Testing.jmx'
          if not plan_path.exists():
              raise SystemExit('Missing Performance_Testing.jmx')

          ET.parse(plan_path)

          scenarios = ['baseline', 'load', 'peak', 'stress']
          required_files = ['index.html', 'statistics.json']
          for scenario in scenarios:
              report_dir = root / 'reports' / scenario
              if not report_dir.exists():
                  raise SystemExit(f'Missing report directory: {report_dir}')

              for required_file in required_files:
                  file_path = report_dir / required_file
                  if not file_path.exists():
                      raise SystemExit(f'Missing required report file: {file_path}')

              with (report_dir / 'statistics.json').open(encoding='utf-8') as handle:
                  json.load(handle)

              result_file = root / 'results' / f'{scenario}.jtl'
              if not result_file.exists():
                  raise SystemExit(f'Missing result file: {result_file}')

          reports_index = root / 'reports' / 'index.html'
          if not reports_index.exists():
              raise SystemExit('Missing reports/index.html landing page')

          print('Performance testing assets validated successfully.')
          PY

      - name: Upload report dashboards as artifact
        uses: actions/upload-artifact@v4
        with:
          name: committed-performance-reports
          path: reports/

      - name: Prepare CI smoke test plan
        shell: bash
        env:
          CI_SCENARIO: ${{ github.event.inputs.scenario || 'baseline' }}
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          plan_path = pathlib.Path('Performance_Testing.jmx')
          output_path = pathlib.Path('artifacts/ci-smoke-test.jmx')
          output_path.parent.mkdir(parents=True, exist_ok=True)

          scenario_map = {
            'baseline': 'TG1 - Baseline Test (50 Users)',
            'load': 'TG2 - Load Test (150 Users)',
            'peak': 'TG3 - Peak Load Test (300 Users)',
            'stress': 'TG4 - Stress Test (500 Users)',
            'endurance': 'TG5 - Endurance Test (100 Users)',
          }

          import os
          scenario = os.environ['CI_SCENARIO']
          selected_name = scenario_map[scenario]

          tree = ET.parse(plan_path)
          root = tree.getroot()

          selected_group = None
          for thread_group in root.findall('.//ThreadGroup'):
            test_name = thread_group.attrib.get('testname', '')
            thread_group.set('enabled', 'true' if test_name == selected_name else 'false')

            if test_name == selected_name:
              selected_group = thread_group

          if selected_group is None:
            raise SystemExit(f'Unable to find thread group for scenario: {scenario}')

          def set_child_text(parent, tag, name, value):
            for child in parent.findall(tag):
              if child.attrib.get('name') == name:
                child.text = value
                return
            raise SystemExit(f'Missing {tag} with name={name}')

          set_child_text(selected_group, 'intProp', 'ThreadGroup.num_threads', '1')
          set_child_text(selected_group, 'intProp', 'ThreadGroup.ramp_time', '1')
          set_child_text(selected_group, 'longProp', 'ThreadGroup.duration', '15')
          set_child_text(selected_group, 'boolProp', 'ThreadGroup.scheduler', 'false')
          set_child_text(selected_group, 'longProp', 'ThreadGroup.delay', '0')

          controller = selected_group.find("elementProp[@name='ThreadGroup.main_controller']")
          if controller is None:
            raise SystemExit('Missing LoopController in selected thread group')

          loops = controller.find("stringProp[@name='LoopController.loops']")
          if loops is None:
            loops = controller.find("intProp[@name='LoopController.loops']")
          if loops is None:
            raise SystemExit('Missing LoopController.loops in selected thread group')

          loops.text = '1'

          continue_forever = controller.find("boolProp[@name='LoopController.continue_forever']")
          if continue_forever is not None:
            continue_forever.text = 'false'

          tree.write(output_path, encoding='UTF-8', xml_declaration=True)
          print(f'Prepared CI smoke test plan for scenario: {scenario}')
          PY

      - name: Run JMeter CI smoke test
        shell: bash
        run: |
          rm -rf artifacts/ci-report
          mkdir -p artifacts
          jmeter -n -t artifacts/ci-smoke-test.jmx -l artifacts/ci-smoke-results.jtl -e -o artifacts/ci-report

      - name: Upload CI smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-test-artifacts
          path: artifacts/
