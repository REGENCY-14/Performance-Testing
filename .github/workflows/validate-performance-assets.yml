name: Validate And Run Performance Assets

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Apache JMeter
        shell: bash
        run: |
          JMETER_VERSION=5.6.3
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" -o apache-jmeter.tgz
          tar -xzf apache-jmeter.tgz
          echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Validate JMeter plan and report structure
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          plan_path = root / 'Performance_Testing.jmx'
          if not plan_path.exists():
              raise SystemExit('Missing Performance_Testing.jmx')

          ET.parse(plan_path)

          scenarios = ['baseline', 'load', 'peak', 'stress']
          required_files = ['index.html', 'statistics.json']
          for scenario in scenarios:
              report_dir = root / 'reports' / scenario
              if not report_dir.exists():
                  raise SystemExit(f'Missing report directory: {report_dir}')

              for required_file in required_files:
                  file_path = report_dir / required_file
                  if not file_path.exists():
                      raise SystemExit(f'Missing required report file: {file_path}')

              with (report_dir / 'statistics.json').open(encoding='utf-8') as handle:
                  json.load(handle)

              result_file = root / 'results' / f'{scenario}.jtl'
              if not result_file.exists():
                  raise SystemExit(f'Missing result file: {result_file}')

          reports_index = root / 'reports' / 'index.html'
          if not reports_index.exists():
              raise SystemExit('Missing reports/index.html landing page')

          print('Performance testing assets validated successfully.')
          PY

      - name: Upload report dashboards as artifact
        uses: actions/upload-artifact@v4
        with:
          name: committed-performance-reports
          path: reports/

      - name: Run all scenario smoke tests sequentially
        shell: bash
        run: |
          mkdir -p artifacts
          for SCENARIO in baseline load peak stress endurance; do
            echo "::group::Smoke test: $SCENARIO"
            python .github/scripts/prepare_smoke_plan.py "$SCENARIO"
            rm -rf "artifacts/${SCENARIO}-report"
            jmeter -n \
              -t "artifacts/${SCENARIO}-smoke-test.jmx" \
              -l "artifacts/${SCENARIO}-results.jtl" \
              -e -o "artifacts/${SCENARIO}-report"
            echo "::endgroup::"
          done

      - name: Upload CI smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-test-artifacts
          path: artifacts/

      - name: Build Slack performance summary table
        if: always()
        id: slack_table
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path

          scenario_meta = [
              ("baseline", "Baseline", "50"),
              ("load", "Load", "150"),
              ("peak", "Peak", "300"),
              ("stress", "Stress", "500"),
              ("endurance", "Endurance", "50 (10min)"),
          ]

          rows = []
          for key, label, users in scenario_meta:
              stats_file = Path("reports") / key / "statistics.json"
              if not stats_file.exists():
                  rows.append((label, users, "-", "-", "-", "-"))
                  continue

              with stats_file.open("r", encoding="utf-8") as handle:
                  data = json.load(handle)

              total = data.get("Total", {})
              samples = int(total.get("sampleCount", 0))
              errors = int(total.get("errorCount", 0))
              error_pct = float(total.get("errorPct", 0.0))
              mean_rt = float(total.get("meanResTime", 0.0))
              rows.append(
                  (
                      label,
                      users,
                      str(samples),
                      str(errors),
                      f"{error_pct:.2f}%",
                      f"{mean_rt:.0f}ms",
                  )
              )

          headers = ("Test", "Users", "Samples", "Errors", "Error %", "Avg RT")
          widths = [max(len(headers[i]), *(len(row[i]) for row in rows)) for i in range(len(headers))]

          def fmt_row(values):
              aligned = [values[0].ljust(widths[0])]
              aligned.extend(values[i].rjust(widths[i]) for i in range(1, len(values)))
              return "| " + " | ".join(aligned) + " |"

          divider = "|-" + "-|-".join("-" * widths[i] for i in range(len(widths))) + "-|"
          table_lines = [fmt_row(headers), divider]
          table_lines.extend(fmt_row(row) for row in rows)
          table_text = "\n".join(table_lines)

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write("table<<EOF\n")
              output.write(table_text)
              output.write("\nEOF\n")
          PY

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Demoblaze Performance Test Results - Run #${{ github.run_number }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Demoblaze Performance Test Results - Run #${{ github.run_number }}*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "```\n${{ steps.slack_table.outputs.table }}\n```"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Full Reports"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Demoblaze Performance Test Results - Run #${{ github.run_number }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Demoblaze Performance Test Results - Run #${{ github.run_number }}*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Current snapshot:\n```\n${{ steps.slack_table.outputs.table }}\n```"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Open Failed Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
